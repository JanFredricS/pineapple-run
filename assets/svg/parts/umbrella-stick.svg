<svg xmlns="http://www.w3.org/2000/svg" width="64" height="8" viewBox="0 0 64 8">
  <!-- Umbrella shaft (bamboo toothpick). Stretched along x between the shock's two anchors. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E2B4"/>
      <stop offset="0.5" stop-color="#E2B878"/>
      <stop offset="1" stop-color="#B8864A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1.5" width="64" height="5" rx="2.5" fill="url(#wood)"/>
  <rect x="0" y="2.4" width="64" height="0.9" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
