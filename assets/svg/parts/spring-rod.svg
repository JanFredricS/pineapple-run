<svg xmlns="http://www.w3.org/2000/svg" width="64" height="8" viewBox="0 0 64 8">
  <!-- Coil-spring shock guide rod (brushed steel). Stretched along x between the shock's two anchors;
       the 5 px band at y 1.5..6.5 is the rod. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EEF2"/>
      <stop offset="0.5" stop-color="#A9B3BC"/>
      <stop offset="1" stop-color="#5E6873"/>
    </linearGradient>
  </defs>
  <rect x="0" y="1.5" width="64" height="5" rx="2.5" fill="url(#steel)"/>
  <rect x="0" y="2.4" width="64" height="0.9" fill="#FFFFFF" fill-opacity="0.6"/>
</svg>
