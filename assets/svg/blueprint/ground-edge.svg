<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <!-- Blueprint edge: drafting-blue ink outline + light rim (surface at y=3; 0.02 m above / 0.4 m below). -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2F7"/>
      <stop offset="1" stop-color="#EEF2F7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="256" height="30" fill="url(#rim)"/>
  <rect x="0" y="2" width="256" height="3" fill="#2A4A78"/>
</svg>
