<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="240" viewBox="0 0 1024 240">
  <!-- Kitchen near layer: back counter with toaster, kettle, fruit bowl and a leaning cutting board. -->
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA3B2"/>
      <stop offset="0.3" stop-color="#F4F7FB"/>
      <stop offset="0.6" stop-color="#C3CBD6"/>
      <stop offset="1" stop-color="#8A94A4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="210" width="1024" height="30" fill="#EAE3D8"/>
  <rect x="0" y="206" width="1024" height="6" fill="#F8F5F0"/>
  <!-- cutting board -->
  <g transform="translate(110 208) rotate(-8)">
    <rect x="-44" y="-150" width="88" height="150" rx="16" fill="#D9A566"/>
    <circle cx="0" cy="-128" r="8" fill="#EAE3D8"/>
    <path d="M-30 -100 Q-34 -50 -28 -10 M24 -110 Q30 -60 22 -12" stroke="#B98446" stroke-opacity="0.5" stroke-width="2" fill="none"/>
  </g>
  <!-- toaster -->
  <g transform="translate(300 208)">
    <rect x="-60" y="-80" width="120" height="80" rx="22" fill="#E97F6D"/>
    <rect x="-60" y="-80" width="120" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect x="-38" y="-84" width="30" height="6" rx="3" fill="#5A606B"/><rect x="8" y="-84" width="30" height="6" rx="3" fill="#5A606B"/>
    <rect x="62" y="-50" width="10" height="8" rx="2" fill="#5A606B"/>
    <path d="M-30 -84 Q-24 -110 -16 -84 M16 -84 Q22 -104 30 -84" fill="#E9C46A" fill-opacity="0.9"/>
  </g>
  <!-- kettle -->
  <g transform="translate(560 208)">
    <path d="M-44 0 Q-52 -60 -30 -90 H30 Q52 -60 44 0 Z" fill="url(#chrome)"/>
    <path d="M-30 -90 Q0 -110 30 -90" fill="#5A606B"/>
    <path d="M44 -60 Q76 -70 80 -96" stroke="url(#chrome)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-40 -70 Q-76 -60 -64 -20" stroke="#2B3140" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="-8" y="-104" width="16" height="10" rx="4" fill="#2B3140"/>
  </g>
  <!-- fruit bowl with a pineapple -->
  <g transform="translate(820 208)">
    <path d="M-30 -52 Q-26 -80 -40 -100 M-30 -52 Q-18 -84 -8 -98 M-30 -52 Q-34 -86 -24 -110" stroke="#3E9A4C" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="-30" cy="-36" rx="22" ry="26" fill="#F2B53A"/>
    <circle cx="10" cy="-26" r="16" fill="#8CC63F"/><circle cx="36" cy="-24" r="14" fill="#F4845F"/>
    <path d="M-70 -30 Q-70 0 -40 0 H40 Q70 0 70 -30 Z" fill="#6D9DC5"/>
    <path d="M-70 -30 H70" stroke="#8FB7D8" stroke-width="4"/>
  </g>
</svg>
