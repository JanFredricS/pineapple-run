<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64">
  <!-- Kitchen edge strip: white marble countertop slab. v: y=2 is the surface, slab to y=40,
       soft under-shadow to y=64 (0.02 m above / 0.5 m below). -->
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.25" stop-color="#F3F1EE"/>
      <stop offset="1" stop-color="#E2DED8"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3A1C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5A3A1C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="40" width="256" height="24" fill="url(#under)"/>
  <rect x="0" y="2" width="256" height="38" fill="url(#slab)"/>
  <!-- veins (start and end at the same y so the tile wraps) -->
  <path d="M0 18 Q40 10 78 22 T150 16 Q190 30 222 20 T256 18" stroke="#B9B3AB" stroke-opacity="0.6" stroke-width="1.3" fill="none"/>
  <path d="M0 30 Q60 36 110 28 T200 34 T256 30" stroke="#C9C3BB" stroke-opacity="0.5" stroke-width="0.9" fill="none"/>
  <path d="M78 22 Q92 30 104 38" stroke="#B9B3AB" stroke-opacity="0.45" stroke-width="0.8" fill="none"/>
  <path d="M170 24 Q176 12 196 6" stroke="#C9C3BB" stroke-opacity="0.45" stroke-width="0.8" fill="none"/>
  <!-- bevel highlight + bottom lip -->
  <rect x="0" y="2" width="256" height="2.5" fill="#FFFFFF"/>
  <rect x="0" y="4.5" width="256" height="1" fill="#D8D3CC"/>
  <rect x="0" y="38" width="256" height="2" fill="#BDB6AD"/>
</svg>
