<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="220" viewBox="0 0 1024 220">
  <!-- Workbench near layer: shelf with a vise, paint cans, screw jars and a tape measure. -->
  <defs>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E98A8"/>
      <stop offset="0.35" stop-color="#EEF2F6"/>
      <stop offset="1" stop-color="#8E98A8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="180" width="1024" height="16" fill="#8A5F36"/>
  <rect x="0" y="180" width="1024" height="3" fill="#B07E4E"/>
  <rect x="0" y="196" width="1024" height="12" fill="#3B2A18" fill-opacity="0.2"/>
  <!-- paint cans -->
  <g transform="translate(90 180)">
    <rect x="-34" y="-70" width="68" height="70" rx="4" fill="url(#can)"/>
    <rect x="-34" y="-52" width="68" height="34" fill="#2EC4B6"/>
    <path d="M-34 -52 Q-20 -40 -24 -18 H-34 Z" fill="#26A69A"/>
    <rect x="-36" y="-74" width="72" height="8" rx="3" fill="#B7C0CC"/>
  </g>
  <g transform="translate(170 180)">
    <rect x="-26" y="-54" width="52" height="54" rx="4" fill="url(#can)"/>
    <rect x="-26" y="-40" width="52" height="26" fill="#FFD166"/>
    <rect x="-28" y="-58" width="56" height="7" rx="3" fill="#B7C0CC"/>
  </g>
  <!-- screw jars -->
  <g transform="translate(330 180)">
    <rect x="-24" y="-58" width="48" height="58" rx="8" fill="#DCE3EA" fill-opacity="0.5"/>
    <g fill="#7C8594"><rect x="-16" y="-20" width="4" height="14" transform="rotate(20 -14 -13)"/><rect x="-2" y="-24" width="4" height="16" transform="rotate(-30 0 -16)"/><rect x="10" y="-18" width="4" height="12"/><rect x="-8" y="-38" width="4" height="14" transform="rotate(60 -6 -31)"/></g>
    <rect x="-24" y="-58" width="48" height="58" rx="8" fill="url(#glass)"/>
    <rect x="-20" y="-68" width="40" height="12" rx="3" fill="#E84855"/>
  </g>
  <g transform="translate(400 180)">
    <rect x="-22" y="-50" width="44" height="50" rx="8" fill="#DCE3EA" fill-opacity="0.5"/>
    <g fill="#C9894A"><circle cx="-8" cy="-12" r="5"/><circle cx="8" cy="-10" r="5"/><circle cx="0" cy="-24" r="5"/></g>
    <rect x="-22" y="-50" width="44" height="50" rx="8" fill="url(#glass)"/>
    <rect x="-18" y="-60" width="36" height="12" rx="3" fill="#2D5E91"/>
  </g>
  <!-- bench vise -->
  <g transform="translate(640 180)">
    <rect x="-70" y="-20" width="140" height="20" rx="4" fill="#3E6FA3"/>
    <rect x="-60" y="-76" width="50" height="58" rx="6" fill="#4A7DB3"/>
    <rect x="10" y="-76" width="50" height="58" rx="6" fill="#4A7DB3"/>
    <rect x="-14" y="-80" width="28" height="10" fill="#B7C0CC"/>
    <rect x="60" y="-54" width="60" height="8" rx="4" fill="url(#can)"/>
    <circle cx="124" cy="-50" r="8" fill="#B7C0CC"/>
    <rect x="-60" y="-76" width="50" height="10" rx="4" fill="#FFFFFF" fill-opacity="0.2"/>
  </g>
  <!-- tape measure -->
  <g transform="translate(880 180)">
    <rect x="-40" y="-70" width="80" height="70" rx="18" fill="#FFD166"/>
    <circle cx="0" cy="-35" r="20" fill="#2B3140"/>
    <circle cx="0" cy="-35" r="9" fill="#FFD166"/>
    <path d="M40 -8 H110" stroke="#F4E3A3" stroke-width="6"/>
    <path d="M110 -12 V0" stroke="#7C8594" stroke-width="4"/>
  </g>
</svg>
