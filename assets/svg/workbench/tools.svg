<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440">
  <!-- Workbench mid layer: pinned blueprint (homage to Coconut Run's graph-paper look) and tools on pegs. -->
  <defs>
    <pattern id="bpgrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 H0 V16" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" fill="none"/>
    </pattern>
    <pattern id="bpgrid2" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.2" fill="none"/>
    </pattern>
    <pattern id="gpgrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0 H0 V12" stroke="#7DA7D9" stroke-opacity="0.45" stroke-width="0.8" fill="none"/>
    </pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E98A8"/>
      <stop offset="0.4" stop-color="#E7ECF2"/>
      <stop offset="1" stop-color="#9AA4B3"/>
    </linearGradient>
    <g id="pin"><circle r="6" fill="#E84855"/><circle cx="-1.8" cy="-1.8" r="2" fill="#FFFFFF" fill-opacity="0.6"/></g>
  </defs>
  <!-- blueprint sheet -->
  <g transform="translate(250 180) rotate(-3)">
    <rect x="-176" y="-136" width="352" height="262" fill="#1B2440" fill-opacity="0.18" transform="translate(5 7)"/>
    <rect x="-176" y="-136" width="352" height="262" fill="#2D5E91"/>
    <rect x="-176" y="-136" width="352" height="262" fill="url(#bpgrid)"/>
    <rect x="-176" y="-136" width="352" height="262" fill="url(#bpgrid2)"/>
    <rect x="-166" y="-126" width="332" height="242" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>
    <!-- cart schematic -->
    <g stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-opacity="0.92">
      <path d="M-110 30 H90 L120 -30"/>
      <path d="M-110 30 L-130 -24"/>
      <path d="M-60 30 L-30 -10 L10 30 L40 -10 L70 30"/>
      <circle cx="-80" cy="62" r="30"/><circle cx="-80" cy="62" r="4"/>
      <circle cx="60" cy="62" r="30"/><circle cx="60" cy="62" r="4"/>
      <path d="M-80 62 L-60 30 M60 62 L40 30" stroke-dasharray="5 4"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.6">
      <circle cx="-70" cy="16" r="10"/><circle cx="-48" cy="16" r="10"/><circle cx="-26" cy="16" r="10"/><circle cx="-4" cy="16" r="10"/>
      <circle cx="-59" cy="-2" r="10"/><circle cx="-37" cy="-2" r="10"/><circle cx="-15" cy="-2" r="10"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1" fill="none">
      <path d="M-80 100 H60 M-80 94 V106 M60 94 V106"/>
      <path d="M140 30 V-30 M134 30 H146 M134 -30 H146"/>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" fill="#FFFFFF" fill-opacity="0.9">
      <text x="-160" y="-104" font-size="15" font-weight="700" letter-spacing="1">PINEAPPLE RUN</text>
      <text x="-160" y="-88" font-size="10" letter-spacing="1" fill-opacity="0.7">CART  MK.1  —  SHEET 1/15</text>
      <text x="-20" y="118" font-size="10" fill-opacity="0.7">1.2 m</text>
    </g>
    <use href="#pin" x="-160" y="-122"/><use href="#pin" x="160" y="-122"/>
  </g>
  <!-- graph paper note -->
  <g transform="translate(900 150) rotate(4)">
    <rect x="-70" y="-90" width="140" height="180" fill="#1B2440" fill-opacity="0.15" transform="translate(4 6)"/>
    <rect x="-70" y="-90" width="140" height="180" fill="#FBFCFE"/>
    <rect x="-70" y="-90" width="140" height="180" fill="url(#gpgrid)"/>
    <path d="M-50 50 Q-20 -40 10 10 T50 -50" stroke="#E84855" stroke-width="2.5" fill="none"/>
    <circle cx="-50" cy="50" r="4" fill="#E84855"/>
    <use href="#pin" x="0" y="-80"/>
  </g>
  <!-- tools on pegs -->
  <g transform="translate(520 60)">
    <!-- wrench -->
    <path d="M0 0 V190" stroke="url(#steel)" stroke-width="16" stroke-linecap="round"/>
    <path d="M-20 -6 A22 22 0 1 0 20 -6 L8 -2 V14 H-8 V-2 Z" fill="#B7C0CC" transform="translate(0 -10)"/>
    <circle cx="0" cy="190" r="15" fill="#B7C0CC"/><circle cx="0" cy="190" r="7" fill="#CFAA78"/>
  </g>
  <g transform="translate(620 50)">
    <!-- hammer -->
    <rect x="-7" y="10" width="14" height="210" rx="6" fill="#C9894A"/>
    <rect x="-7" y="150" width="14" height="70" rx="6" fill="#2B3140"/>
    <path d="M-44 -6 H30 Q46 -6 46 8 V22 H-44 Q-56 22 -56 8 Z" fill="url(#steel)"/>
  </g>
  <g transform="translate(740 40)">
    <!-- hand saw -->
    <path d="M-30 0 H30 Q40 0 40 14 V70 Q40 82 28 82 H-30 Q-40 82 -40 70 V14 Q-40 0 -30 0 Z" fill="#E84855"/>
    <rect x="-18" y="18" width="36" height="46" rx="12" fill="#CFAA78"/>
    <path d="M-40 70 L-20 330 L40 330 L40 76 Z" fill="url(#steel)"/>
    <path d="M-20 330 L-16 322 L-12 330 L-8 322 L-4 330 L0 322 L4 330 L8 322 L12 330 L16 322 L20 330 L24 322 L28 330 L32 322 L36 330" fill="#9AA4B3"/>
  </g>
  <g fill="#6A4E30">
    <circle cx="520" cy="36" r="4"/><circle cx="620" cy="36" r="4"/><circle cx="740" cy="28" r="4"/>
  </g>
</svg>
