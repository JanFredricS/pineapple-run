<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="360" viewBox="0 0 1024 360">
  <!-- Tiki far layer: a big low moon, a planet with a ring and scattered stars over a dusk sky
       (transparent: the palette gradient is drawn behind). Zero-G: the sky is half outer space. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9C4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE9C4" stop-opacity="0"/>
    </radialGradient>
    <g id="star"><path d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z" fill="#FFF4E0"/></g>
  </defs>
  <circle cx="300" cy="170" r="130" fill="url(#glow)"/>
  <circle cx="300" cy="170" r="70" fill="#FFF1D6"/>
  <circle cx="276" cy="150" r="14" fill="#EBD9BA"/>
  <circle cx="322" cy="196" r="10" fill="#EBD9BA"/>
  <circle cx="330" cy="140" r="7" fill="#EBD9BA"/>
  <g transform="translate(770 110)">
    <ellipse rx="64" ry="12" fill="none" stroke="#36D6C3" stroke-opacity="0.8" stroke-width="5" transform="rotate(-16)"/>
    <circle r="30" fill="#FF8FAB"/>
    <path d="M-28 -8 Q0 -2 28 -12" stroke="#E0607F" stroke-width="5" fill="none"/>
    <path d="M-60 8 A64 12 -16 0 0 60 -26" stroke="#36D6C3" stroke-width="5" fill="none" transform="rotate(0)"/>
  </g>
  <use href="#star" transform="translate(80 60)"/>
  <use href="#star" transform="translate(170 250) scale(0.6)"/>
  <use href="#star" transform="translate(470 70) scale(0.8)"/>
  <use href="#star" transform="translate(560 200) scale(0.5)"/>
  <use href="#star" transform="translate(640 40) scale(0.7)"/>
  <use href="#star" transform="translate(900 250) scale(0.6)"/>
  <use href="#star" transform="translate(980 60) scale(0.9)"/>
  <circle cx="130" cy="140" r="1.6" fill="#FFF4E0"/>
  <circle cx="420" cy="30" r="1.4" fill="#FFF4E0"/>
  <circle cx="700" cy="280" r="1.2" fill="#FFF4E0"/>
  <circle cx="860" cy="20" r="1.5" fill="#FFF4E0"/>
  <circle cx="30" cy="300" r="1.2" fill="#FFF4E0"/>
</svg>
