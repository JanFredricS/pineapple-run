<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="300" viewBox="0 0 1024 300">
  <!-- Tiki mid layer: the back bar — a thatched awning, shelves of bottles drifting off their
       shelf in zero-G, and a carved tiki mask. -->
  <defs>
    <g id="bottle">
      <rect x="-7" y="-30" width="14" height="30" rx="4"/>
      <rect x="-3" y="-42" width="6" height="14"/>
    </g>
    <g id="mask">
      <rect x="-26" y="-70" width="52" height="84" rx="10" fill="#6E4524"/>
      <rect x="-20" y="-52" width="16" height="12" fill="#2A160A"/>
      <rect x="4" y="-52" width="16" height="12" fill="#2A160A"/>
      <rect x="-5" y="-38" width="10" height="20" fill="#8E5E33"/>
      <rect x="-18" y="-10" width="36" height="12" rx="3" fill="#2A160A"/>
      <path d="M-18 -10 L-12 -4 L-6 -10 L0 -4 L6 -10 L12 -4 L18 -10" stroke="#F2E2BF" stroke-width="2" fill="none"/>
    </g>
  </defs>
  <!-- thatched awning -->
  <path d="M0 40 H1024 V70 Q992 84 960 70 T896 70 T832 70 T768 70 T704 70 T640 70 T576 70 T512 70 T448 70 T384 70 T320 70 T256 70 T192 70 T128 70 T64 70 T0 70 Z" fill="#8F6A2E" fill-opacity="0.85"/>
  <!-- back wall + shelves -->
  <rect x="0" y="70" width="1024" height="230" fill="#4A2F5E" fill-opacity="0.55"/>
  <rect x="0" y="150" width="1024" height="8" fill="#7C5028"/>
  <rect x="0" y="236" width="1024" height="8" fill="#7C5028"/>
  <g fill="#36D6C3" fill-opacity="0.85">
    <use href="#bottle" transform="translate(60 150)"/>
    <use href="#bottle" transform="translate(420 236)"/>
    <use href="#bottle" transform="translate(860 150)"/>
  </g>
  <g fill="#FF8FAB" fill-opacity="0.85">
    <use href="#bottle" transform="translate(84 150)"/>
    <use href="#bottle" transform="translate(620 236)"/>
  </g>
  <g fill="#F7B733" fill-opacity="0.85">
    <use href="#bottle" transform="translate(108 150)"/>
    <use href="#bottle" transform="translate(884 150)"/>
    <use href="#bottle" transform="translate(644 236)"/>
  </g>
  <!-- drifting bottles (zero-G) -->
  <g fill="#FF8FAB" fill-opacity="0.85"><use href="#bottle" transform="translate(180 116) rotate(24)"/></g>
  <g fill="#36D6C3" fill-opacity="0.85"><use href="#bottle" transform="translate(520 110) rotate(-38)"/></g>
  <g fill="#F7B733" fill-opacity="0.85"><use href="#bottle" transform="translate(760 206) rotate(70)"/></g>
  <use href="#mask" transform="translate(320 226)"/>
  <use href="#mask" transform="translate(980 226) scale(0.8)"/>
</svg>
