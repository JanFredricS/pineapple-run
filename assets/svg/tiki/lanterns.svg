      <path d="M0 -150 Q10 -134 6 -126 Q0 -122 -6 -126 Q-10 -134 0 -150 Z" fill="#FF8A3D"/>
    </g>
  </defs>
  <path d="M0 22 Q128 60 256 22 T512 22 T768 22 T1024 22" stroke="#2A160A" stroke-width="2" fill="none"/>
  <use href="#bulb" transform="translate(64 38)"/>
