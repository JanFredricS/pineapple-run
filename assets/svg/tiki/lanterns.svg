<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="240" viewBox="0 0 1024 240">
  <!-- Tiki near layer: string lights, floating paper lanterns, tiki torches and palm fronds. -->
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD37A" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFD37A" stop-opacity="0"/>
    </radialGradient>
    <g id="lantern">
      <circle r="26" fill="url(#halo)"/>
      <ellipse rx="12" ry="15" fill="#FF5E8A"/>
      <path d="M-12 0 H12 M-10 -8 H10 M-10 8 H10" stroke="#C23C63" stroke-width="1.4"/>
      <rect x="-5" y="-18" width="10" height="4" fill="#3B2A5E"/>
    </g>
    <g id="bulb"><circle r="10" fill="url(#halo)"/><circle r="4" fill="#FFE9A8"/></g>
    <g id="torch">
      <rect x="-3" y="-120" width="6" height="120" fill="#5A3818"/>
      <path d="M-9 -124 H9 L6 -104 H-6 Z" fill="#8F6A2E"/>
