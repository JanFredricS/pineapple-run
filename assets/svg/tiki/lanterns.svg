  <use href="#bulb" transform="translate(192 38)"/>
  <use href="#bulb" transform="translate(320 38)"/>
  <use href="#bulb" transform="translate(384 44)"/>
  <use href="#bulb" transform="translate(448 38)"/>
  <use href="#bulb" transform="translate(576 38)"/>
  <use href="#bulb" transform="translate(640 44)"/>
  <use href="#bulb" transform="translate(704 38)"/>
  <use href="#bulb" transform="translate(832 38)"/>
  <use href="#bulb" transform="translate(896 44)"/>
  <use href="#bulb" transform="translate(960 38)"/>
  <use href="#lantern" transform="translate(240 110)"/>
  <use href="#lantern" transform="translate(610 90) rotate(12)"/>
  <use href="#lantern" transform="translate(890 130) rotate(-10)"/>
  <use href="#torch" transform="translate(120 240)"/>
  <use href="#torch" transform="translate(760 240)"/>
